          scripts/tier.sh experiment:seed-controls seed-controls 4200 340000 -- scripts/test.sh --locked --release --test htree_descent_seed_controls
          bash scripts/core.sh test-floor seed-controls 7
          cp tmp/logs/runner-controls.log tmp/htree-descent-experiment/runner-controls.log
          cp tmp/logs/seed-controls.log tmp/htree-descent-experiment/seed-controls.log
      - name: Execute bounded batch 3 without retries
        timeout-minutes: 40
        run: python3 scripts/htree-descent-experiment.py batch 3
      - name: Retain completed phases and any original failing witness
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htree-descent-experiment-batch-3
          path: tmp/htree-descent-experiment/
          if-no-files-found: error
          retention-days: 30
      - name: Verify actual uploaded bytes before leaving the runner
        if: always() && steps.evidence.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/htree-descent-experiment.py verify-upload ${{ steps.evidence.outputs.artifact-id }}
  experiment-ok:
    if: always()
    needs: [batch-0, batch-1, batch-2, batch-3]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every finite batch, including its retention checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert len(results) == 4 and all(row['result'] == 'success' for row in results.values()), results
          print('33 signed trials complete: failure not reproduced; original oracle gate remains unresolved')
          PYTHON
