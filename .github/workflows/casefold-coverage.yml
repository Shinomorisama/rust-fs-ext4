name: casefold coverage

on:
  push:
    branches: [casefold-rw]
    paths:
      - .github/workflows/casefold-coverage.yml
      - scripts/casefold-coverage.sh
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA to measure (empty means the selected branch HEAD)
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  CHORE_VERSION: "0.11.0"
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "4"

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        working-directory: rust-fs-ext4
    steps:
      - uses: actions/checkout@v4
        with:
          path: stage0-tools
      - name: Check out the selected commit for coverage
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || github.sha }}
          path: rust-fs-ext4
      - run: scripts/ci-install-chore.sh
      - run: chore siblings
      - name: Verify pinned siblings
        run: |
          test "$(git -C ../rust-fs-core rev-parse HEAD)" = 9e900154a7dff2a6c8f136db31def33bed9f09cc
          test "$(git -C ../fs-linux-test-harness rev-parse HEAD)" = 7e0a84291c76fe4c762143f6f6d5787cc11749e7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - run: cargo install --locked cargo-llvm-cov --version 0.9.1
      - run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Build fixtures from the selected checkout
        run: chore fixtures
      - name: Measure coverage at the exact selected commit
        env:
          CASEFOLD_COVERAGE_REVISION: ${{ inputs.revision || github.sha }}
        run: bash ../stage0-tools/scripts/casefold-coverage.sh
      - name: Keep coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casefold-coverage
          path: |
            rust-fs-ext4/tmp/casefold-coverage/
            rust-fs-ext4/tmp/logs/casefold-coverage.log
          if-no-files-found: error
          retention-days: 30
