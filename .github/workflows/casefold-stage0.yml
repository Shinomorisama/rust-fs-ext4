name: casefold Stage 0 evidence

on:
  push:
    branches: [casefold-rw]
    paths:
      - .github/workflows/casefold-stage0.yml
      - tests/casefold_fixture_oracle.rs
      - src/fs.rs
      - src/capi.rs
      - src/fs/**
      - src/operation.rs
      - src/extent.rs
      - src/extent/**
      - src/inode_inventory.rs
      - src/inode_roles.rs
      - src/fixed_metadata.rs
      - src/block_allocation.rs
      - src/ownership.rs
      - src/lib.rs
      - tests/inode_inventory_guest.py
      - tests/block_allocation_guest.py
      - tests/ownership_guest.py
      - tests/inode_roles_guest.py
      - tests/extent_ownership_guest.py
      - src/path.rs
      - src/htree.rs
      - src/htree_mut.rs
      - src/casefold/**
      - src/casefold.rs
      - tests/casefold_deep_guest.py
      - tests/casefold_fixture_guest.py
      - tests/casefold_behavior_guest.py
      - tests/casefold_cold_create_guest.py
      - test-disks/casefold-oracle-profile.json
      - test-disks/casefold-behavior-reference.json
      - test-disks/casefold-cold-create-reference.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CHORE_VERSION: "0.11.0"
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "4"

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-install-chore.sh
      - run: chore siblings
      - name: Verify pinned siblings
        run: |
          test "$(git -C ../rust-fs-core rev-parse HEAD)" = 9e900154a7dff2a6c8f136db31def33bed9f09cc
          test "$(git -C ../fs-linux-test-harness rev-parse HEAD)" = 7e0a84291c76fe4c762143f6f6d5787cc11749e7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Verify driver-planned casefold insertion with Linux
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/casefold-index-insert
        run: |
          scripts/tier.sh casefold:index-insert casefold-index-insert 1050 65000 -- scripts/test.sh --locked --release --lib fs::tests::needs_host::casefold_inplace_index_insert_is_readable_by_linux_and_e2fsck_clean -- --exact --show-output
          bash scripts/core.sh test-floor casefold-index-insert 1
      - name: Generate and verify Linux casefold fixtures
        run: |
          scripts/tier.sh casefold:fixtures casefold-fixtures 1050 65000 -- scripts/test.sh --locked --release --test casefold_fixture_oracle -- --show-output
          bash scripts/core.sh test-floor casefold-fixtures 1
      - name: Compare complete extent ownership with Linux FIEMAP
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/extent-ownership
        run: |
          scripts/tier.sh casefold:extent-owner casefold-extent-owner 1050 65000 -- scripts/test.sh --locked --release --lib extent::ownership::tests::needs_host::linux_fiemap_matches_complete_inline_and_external_ownership -- --exact --show-output
          bash scripts/core.sh test-floor casefold-extent-owner 1
      - name: Compare complete inode inventory with Linux allocation bits
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/inode-inventory
        run: |
          scripts/tier.sh casefold:inode-inventory casefold-inode-inventory 1050 65000 -- scripts/test.sh --locked --release --lib inode_inventory::needs_host::linux_inventory_matches_every_debugfs_allocation_bit -- --exact --show-output
          bash scripts/core.sh test-floor casefold-inode-inventory 1
      - name: Compare current inode roles with Linux records
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/inode-roles
        run: |
          scripts/tier.sh casefold:inode-roles casefold-inode-roles 1050 65000 -- scripts/test.sh --locked --release --lib inode_roles::needs_host::linux_roles_match_every_allocated_debugfs_record -- --exact --show-output
          bash scripts/core.sh test-floor casefold-inode-roles 1
      - name: Compare complete fixed metadata ranges with Linux locations
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/fixed-metadata
        run: |
          scripts/tier.sh casefold:fixed-metadata casefold-fixed-metadata 1050 65000 -- scripts/test.sh --locked --release --lib fixed_metadata::needs_host::linux_locations_match_complete_fixed_metadata_ranges -- --exact --show-output
          bash scripts/core.sh test-floor casefold-fixed-metadata 1
      - name: Compare bounded allocation intervals with every Linux block bit
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/block-allocation
        run: |
          scripts/tier.sh casefold:block-allocation casefold-block-allocation 1050 65000 -- scripts/test.sh --locked --release --lib block_allocation::needs_host::linux_allocation_intervals_match_every_debugfs_block_bit -- --exact --show-output
          bash scripts/core.sh test-floor casefold-block-allocation 1
      - name: Compare complete current ownership with Linux reports
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/ownership
        run: |
          scripts/tier.sh casefold:ownership casefold-ownership 1050 65000 -- scripts/test.sh --locked --release --lib ownership::needs_host::linux_complete_ownership_matches_all_inode_and_fixed_storage_reports -- --exact --show-output
          bash scripts/core.sh test-floor casefold-ownership 1
      - name: Check private mount chmod metadata with Linux and e2fsprogs
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/private-chmod
        run: |
          scripts/tier.sh casefold:private-chmod casefold-private-chmod 1050 65000 -- scripts/test.sh --locked --release --lib fs::guarded_chmod::needs_host::linux_checks_private_chmod_metadata -- --exact --show-output
          bash scripts/core.sh test-floor casefold-private-chmod 1
      - name: Check public Rust and C chmod dispatch with Linux and e2fsprogs
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/public-chmod
        run: |
          scripts/tier.sh casefold:public-chmod casefold-public-chmod 1050 65000 -- scripts/test.sh --locked --release --lib fs::guarded_chmod::needs_host::linux_checks_public_chmod_metadata -- --exact --show-output
          bash scripts/core.sh test-floor casefold-public-chmod 1
      - name: Check public Rust and C owner metadata with Linux and e2fsprogs
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/public-chown
        run: |
          scripts/tier.sh casefold:public-chown casefold-public-chown 1050 65000 -- scripts/test.sh --locked --release --lib fs::guarded_chmod::needs_host::chown::linux_checks_public_chown_metadata -- --exact --show-output
          bash scripts/core.sh test-floor casefold-public-chown 1
      - name: Check public Rust and C timestamps with Linux and e2fsprogs
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/public-utimens
        run: |
          scripts/tier.sh casefold:public-utimens casefold-public-utimens 1050 65000 -- scripts/test.sh --locked --release --lib fs::guarded_chmod::needs_host::utimens::linux_checks_public_utimens_metadata -- --exact --show-output
          bash scripts/core.sh test-floor casefold-public-utimens 1
      - name: Check public Rust and C inode flags with Linux and e2fsprogs
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/public-flags
        run: |
          scripts/tier.sh casefold:public-flags casefold-public-flags 1050 65000 -- scripts/test.sh --locked --release --lib fs::guarded_chmod::needs_host::flags::linux_checks_public_flags_metadata -- --exact --show-output
          bash scripts/core.sh test-floor casefold-public-flags 1
      - name: Check public Rust and C xattr removal with Linux and e2fsprogs
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/public-removexattr
        run: |
          scripts/tier.sh casefold:public-removexattr casefold-public-removexattr 2100 130000 -- scripts/test.sh --locked --release --lib fs::guarded_chmod::needs_host::removexattr::linux_checks_public_removexattr_metadata -- --exact --show-output
          bash scripts/core.sh test-floor casefold-public-removexattr 1
      - name: Keep completed fixtures and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casefold-fixtures
          path: |
            tmp/casefold-stage0/
            tmp/logs/casefold-fixtures.log
            tmp/casefold-index-insert/
            tmp/logs/casefold-index-insert.log
            tmp/logs/casefold-extent-owner.log
            tmp/extent-ownership/
            tmp/logs/casefold-inode-inventory.log
            tmp/inode-inventory/
            tmp/logs/casefold-inode-roles.log
            tmp/inode-roles/
            tmp/logs/casefold-fixed-metadata.log
            tmp/fixed-metadata/
            tmp/logs/casefold-block-allocation.log
            tmp/block-allocation/
            tmp/logs/casefold-ownership.log
            tmp/ownership/
            tmp/logs/casefold-private-chmod.log
            tmp/private-chmod/
            tmp/logs/casefold-public-chmod.log
            tmp/public-chmod/
            tmp/logs/casefold-public-chown.log
            tmp/public-chown/
            tmp/logs/casefold-public-utimens.log
            tmp/public-utimens/
            tmp/logs/casefold-public-flags.log
            tmp/public-flags/
            tmp/logs/casefold-public-removexattr.log
            tmp/public-removexattr/
          if-no-files-found: error
          retention-days: 30
