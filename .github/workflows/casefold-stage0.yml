name: casefold Stage 0 evidence

on:
  push:
    branches: [casefold-rw]
    paths:
      - .github/workflows/casefold-stage0.yml
      - tests/casefold_fixture_oracle.rs
      - src/fs.rs
      - src/inline_mut.rs
      - src/inline_data.rs
      - src/xattr.rs
      - src/dir.rs
      - src/checksum.rs
      - src/alloc.rs
      - src/bgd.rs
      - src/inode.rs
      - src/capi.rs
      - src/fs/**
      - src/operation.rs
      - src/extent.rs
      - src/extent/**
      - src/inode_inventory.rs
      - src/inode_roles.rs
      - src/fixed_metadata.rs
      - src/block_allocation.rs
      - src/ownership.rs
      - src/lib.rs
      - tests/inode_inventory_guest.py
      - tests/block_allocation_guest.py
      - tests/ownership_guest.py
      - tests/inode_roles_guest.py
      - tests/extent_ownership_guest.py
      - src/path.rs
      - src/htree.rs
      - src/htree_mut.rs
      - src/casefold/**
      - src/casefold.rs
      - tests/casefold_deep_guest.py
      - tests/casefold_fixture_guest.py
      - tests/casefold_behavior_guest.py
      - tests/casefold_cold_create_guest.py
      - test-disks/casefold-oracle-profile.json
      - test-disks/casefold-behavior-reference.json
      - test-disks/casefold-cold-create-reference.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CHORE_VERSION: "0.11.0"
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: "4"

jobs:
  link-counter-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Borrow the measured larger inline/linear ceiling; retain and measure
    # this reference's complete log without assuming a new output size.
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-install-chore.sh
      - run: chore siblings
      - name: Verify pinned siblings
        run: |
          test "$(git -C ../rust-fs-core rev-parse HEAD)" = 9e900154a7dff2a6c8f136db31def33bed9f09cc
          test "$(git -C ../fs-linux-test-harness rev-parse HEAD)" = 7e0a84291c76fe4c762143f6f6d5787cc11749e7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Retain exact counter reference source identity
        run: |
          mkdir -p tmp/link-counter-reference
          git rev-parse HEAD > tmp/link-counter-reference/source-commit.txt
          sha256sum src/fs.rs src/capi.rs src/fs/guarded_chmod.rs src/fs/guarded_chmod/needs_host.rs src/fs/guarded_chmod/needs_host/link_emission.rs src/fs/guarded_chmod/needs_host/link_counter.rs src/fs/guarded_chmod/needs_host/link_counter_guest.py src/fs/guarded_chmod/needs_host/setxattr.rs src/fs/guarded_chmod/tests/link_calls.rs src/fs/guarded_chmod/tests/link_counter.rs src/operation.rs src/inode.rs src/dir.rs src/extent.rs src/bgd.rs src/checksum.rs src/block_io.rs tests/support/src/lib.rs Cargo.toml Cargo.lock .github/workflows/casefold-stage0.yml > tmp/link-counter-reference/source-sha256.txt
      - name: Observe Linux directory-counter boundaries without driver namespace writes
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/link-counter-reference
        run: |
          scripts/tier.sh casefold:link-counter-reference casefold-link-counter-reference 4200 340000 -- scripts/test.sh --locked --release --lib fs::guarded_chmod::needs_host::link_emission::counter_reference::linux_records_link_counter_boundaries -- --exact --show-output
          bash scripts/core.sh test-floor casefold-link-counter-reference 1
      - name: Keep seeded, refused, linked and cold images with raw observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-counter-reference
          path: |
            tmp/link-counter-reference/
            tmp/logs/casefold-link-counter-reference.log
          if-no-files-found: error
          retention-days: 30
  link-inline-conversion:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    # Initial cap matches the larger 352-image linear profile (2,157 lines /
    # 295,955 bytes observed); measure this new job from its retained full log.
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci-install-chore.sh
      - run: chore siblings
      - name: Verify pinned siblings
        run: |
          test "$(git -C ../rust-fs-core rev-parse HEAD)" = 9e900154a7dff2a6c8f136db31def33bed9f09cc
          test "$(git -C ../fs-linux-test-harness rev-parse HEAD)" = 7e0a84291c76fe4c762143f6f6d5787cc11749e7
