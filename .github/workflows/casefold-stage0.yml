      - name: Check public Rust and C inline-parent fit, conversion and postfit
        env:
          FS_EXT4_TEST_TMPDIR: ${{ github.workspace }}/tmp/link-inline-conversion
        run: |
          scripts/tier.sh casefold:link-inline-conversion casefold-link-inline-conversion 4200 340000 -- scripts/test.sh --locked --release --lib fs::guarded_chmod::needs_host::link_emission::inline_conversion::linux_checks_public_link_inline_conversion -- --exact --show-output
          bash scripts/core.sh test-floor casefold-link-inline-conversion 1
      - name: Keep inline input, allocator, dirty/closed/cold images and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-inline-conversion
          path: |
            tmp/link-inline-conversion/
